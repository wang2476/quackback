name: Layer ARM64 image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Layer release tag
        required: true
        default: layer-v0.13.2.1

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wang2476/quackback

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          cache-from: type=gha,scope=layer-linux-arm64
          cache-to: type=gha,mode=max,scope=layer-linux-arm64
